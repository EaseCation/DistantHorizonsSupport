plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'net.easecation.dhsupport'
version = rootProject.version

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnlyApi 'io.papermc.paper:paper-api:1.21.10-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:25.0.0'
}

// Compiled against by SkyblockCore; published to the EaseCation private repository (Aliyun Yunxiao Packages)
// as net.easecation.dhsupport:api. Credentials: yunxiaoMavenUsername / yunxiaoMavenPassword in
// ~/.gradle/gradle.properties.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'yunxiaoMaven'
            url = uri(version.toString().endsWith('-SNAPSHOT')
                    ? 'https://easecation-cn-hangzhou.devops.aliyuncs.com/packages/api/protocol/maven/14075-snapshot-bjmmxv'
                    : 'https://easecation-cn-hangzhou.devops.aliyuncs.com/packages/api/protocol/maven/14075-release-h64s7e')
            credentials(PasswordCredentials)
        }
    }
}
